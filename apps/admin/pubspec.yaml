name: nightlife_admin
description: Super Admin dashboard for the Nightlife platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  nightlife_shared:
    path: ../../packages/nightlife_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
flutter:
  uses-material-design: true

  assets:
    - assets/images/nightlife/